name: update-sources

# 每 6 小时自动拉取上游源并重新生成订阅文件；也支持手动触发、推送 main 分支时重建
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 拉取上游并生成订阅
        run: python3 scripts/build_sources.py

      - name: 提交更新后的订阅文件
        run: |
          git config user.name "liuli-sub-bot"
          git config user.email "liuli-sub-bot@users.noreply.github.com"
          git add sources/
          if ! git diff --staged --quiet; then
            git commit -m "auto update sources $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "订阅内容无变化，无需提交"
          fi
